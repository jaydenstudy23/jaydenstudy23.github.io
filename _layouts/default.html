<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% if site.tagline %} · {{ site.tagline }}{% endif %}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | truncate: 160 }}">
  <meta name="author" content="{{ site.author }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | truncate: 160 }}">
  <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">&gt;_</span>{{ site.title }}
      </a>

      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' %} aria-current="page"{% endif %}>Blog</a>
        <a href="https://github.com/{{ site.github_username }}" rel="noopener noreferrer">GitHub&nbsp;&#8599;</a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p class="footer-copy">&copy; {{ site.time | date: '%Y' }} {{ site.author }}</p>
      <p class="footer-links">
        <a href="https://github.com/{{ site.github_username }}" rel="noopener noreferrer">GitHub</a>
        {% if site.linkedin_url != "" %}<a href="{{ site.linkedin_url }}" rel="noopener noreferrer">LinkedIn</a>{% endif %}
        {% if site.email %}<a href="mailto:{{ site.email }}">Email</a>{% endif %}
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </p>
    </div>
  </footer>
</body>
</html>
